<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Salvo Bros — Aventura en progreso</title>
  <meta name="description" content="Juego interactivo de Super Salvo Bros. Encuentra las llaves y abre el cofre.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23140c18'/%3E%3Crect x='2' y='6' width='12' height='6' fill='%23e7b03a'/%3E%3Crect x='6' y='3' width='4' height='3' fill='%23ff5a3c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --ink: #1a120c;
      --gold: #ffe566;
      --cream: #f6efe2;
      --night: #120c16;
      --panel: #1b2438;
    }
    * { box-sizing: border-box; }
    body.game {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      font-family: "Press Start 2P", monospace;
      background:
        radial-gradient(ellipse at 50% -10%, #4a2d6b 0%, transparent 52%),
        radial-gradient(ellipse at 80% 110%, #7a3418 0%, transparent 42%),
        var(--night);
    }
    button { font-family: inherit; }
    .bezel {
      background: linear-gradient(180deg, #2c3346, #161a26);
      border: 4px solid #0c0e14;
      border-radius: 22px;
      padding: 12px;
      box-shadow: inset 0 0 0 3px #3c455c, inset 0 0 0 7px #12151e, 0 18px 0 #07060a;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 10px;
      background: #07060c;
      box-shadow: inset 0 0 0 3px #07080c;
    }
    .shot {
      position: absolute;
      inset: 0;
      transform: scale(1.08);
      transform-origin: center;
    }
    .shot img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #07060c;
      pointer-events: none;
    }
    #room { opacity: 0; transition: opacity .45s ease; }
    .stage.in-room #room { opacity: 1; }
    .stage.in-room #title-art { opacity: 0; }
    #room.is-fading { opacity: 0; }
    .stage[data-view="title"] .scanlines { opacity: 0; }

    .title-ui {
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: 94%;
    }
    .stage:not([data-view="title"]) .title-ui { display: none; }
    .subtitle {
      margin: 0;
      padding: 8px 12px 7px;
      color: #1a120c;
      background: #fff6ea;
      border: 3px solid #1a120c;
      box-shadow: 4px 4px 0 #1a120c;
      font-size: clamp(8px, 1.4vw, 13px);
    }
    h1.sr-only { position: absolute; }

    .sound-btn, .pixel-btn {
      border: 3px solid #1a120c;
      box-shadow: 3px 3px 0 #1a120c;
      cursor: pointer;
    }
    .sound-btn {
      position: absolute;
      z-index: 8;
      top: 10px;
      right: 10px;
      font-size: 8px;
      padding: 8px;
      color: #1a120c;
      background: var(--gold);
    }
    .sound-btn:active, .pixel-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1a120c; }
    .pixel-btn:focus-visible, .sound-btn:focus-visible, .hot:focus-visible {
      outline: 3px solid #9be7ff;
      outline-offset: 2px;
    }
    .pixel-btn {
      padding: 14px 16px;
      font-size: 11px;
      line-height: 1.45;
      background: #ffc233;
      color: #2a1608;
    }
    .pixel-btn:hover:not(:disabled) { background: #ffd566; }
    .pixel-btn[hidden] { display: none; }

    .hot {
      position: absolute;
      z-index: 4;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .hot { border-radius: 46%; }
    .hot:hover, .hot:focus-visible {
      outline: none;
      background: radial-gradient(ellipse at center, rgba(255, 236, 170, .34), rgba(255, 214, 110, 0) 70%);
      box-shadow: none;
    }
    .hots { display: none; }
    .stage[data-view="hunt"] .hots-1,
    .stage[data-view="level2"] .hots-2,
    .stage[data-view="quake"] .hots-2 { display: block; }
    .stage.has-cart .hot-tv2,
    .stage.has-mystic .hot-chest2 {
      background: radial-gradient(ellipse at center, rgba(255, 220, 120, .22), rgba(255, 190, 60, 0) 68%);
      animation: ready 1.8s ease-in-out infinite;
    }
    .stage.tv-on .hot-tv2 { animation: none; background: transparent; }
    @keyframes ready {
      50% { background: radial-gradient(ellipse at center, rgba(255, 220, 120, .4), rgba(255, 190, 60, 0) 68%); }
    }
    .debug .hot { background: rgba(255, 70, 70, .35); box-shadow: inset 0 0 0 2px #ff5a5a; }

    .item {
      position: absolute;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 2px 0 rgba(42, 28, 16, .4)) drop-shadow(0 0 8px rgba(255, 206, 90, .28));
    }
    .item svg { width: 100%; height: auto; display: block; }
    .chest-lit {
      position: absolute;
      z-index: 3;
      left: 60%;
      top: 39%;
      width: 22%;
      height: 28%;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(255, 244, 186, .92), rgba(255, 186, 64, .42) 46%, transparent 72%);
      mix-blend-mode: screen;
    }
    .stage[data-view="hunt"].has-key .chest-lit { opacity: 1; animation: chestpulse 1.5s ease-in-out infinite; }
    .stage[data-view="hunt"].has-key .key-pop {
      display: grid;
      left: 77%;
      top: 24%;
      width: 7.5%;
      animation: pop .45s ease both;
    }
    @keyframes chestpulse { 50% { opacity: .5; } }
    .stage.has-mystic .mystic {
      display: grid;
      left: 68%;
      top: 16%;
      width: 14%;
      animation: floaty 1.1s ease-in-out infinite, pop .4s ease both;
    }
    .key-label {
      position: absolute;
      top: auto;
      bottom: 118%;
      left: 50%;
      transform: translateX(-50%);
      color: #ffe566;
      font-size: clamp(7px, 1vw, 10px);
      white-space: nowrap;
      text-shadow: 2px 2px 0 #000;
    }
    .stage.has-cart .cart-pop { display: grid; left: 60%; top: 34%; width: 6%; animation: pop .4s ease both; }
    @keyframes pop { from { transform: translateY(10px) scale(.4); opacity: 0; } }
    @keyframes floaty { 50% { transform: translateY(-8px); } }

    .tv-glow, .bloom {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
    }
    .tv-glow {
      left: 16%;
      top: 29%;
      width: 24%;
      height: 24%;
      border-radius: 46%;
      background: radial-gradient(ellipse at center, rgba(170, 255, 230, .4), rgba(80, 220, 190, 0) 70%);
      box-shadow: none;
    }
    .stage.tv-on .tv-glow { opacity: 1; animation: tvready 1.8s ease-in-out infinite; }
    @keyframes tvready {
      50% { background: radial-gradient(ellipse at center, rgba(190, 255, 236, .62), rgba(80, 220, 190, 0) 70%); }
    }
    .bloom {
      left: 58%;
      top: 28%;
      width: 28%;
      height: 42%;
      background: radial-gradient(circle, rgba(255,248,210,.95), rgba(255,190,60,.45) 42%, transparent 70%);
      mix-blend-mode: screen;
    }
    .stage.chest-glow .bloom { animation: bloom 1.1s ease forwards; }
    @keyframes bloom {
      0% { opacity: 0; transform: scale(.4); }
      40% { opacity: 1; transform: scale(1); }
      100% { opacity: .8; transform: scale(1.05); }
    }
    .stage.quake .shot { animation: quake .12s linear 8; }
    @keyframes quake {
      0%, 100% { transform: scale(1.08) translate(0, 0); }
      25% { transform: scale(1.08) translate(-5px, 2px); }
      50% { transform: scale(1.08) translate(6px, -3px); }
      75% { transform: scale(1.08) translate(-3px, 3px); }
    }

    .toys { display: none; position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .stage.show-toys .toys { display: block; }
    .toy-bot { position: absolute; bottom: 8%; width: 6.6%; filter: drop-shadow(0 3px 0 rgba(42, 24, 12, .28)); }
    .toy-bot.a { left: 51%; }
    .toy-bot.b { left: 63%; bottom: 9%; width: 5.8%; }

    .callout {
      display: none;
      position: absolute;
      z-index: 6;
      top: 0;
      left: 2.5%;
      right: 2.5%;
      min-height: 30%;
      padding: 16px 12px 12px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      background: linear-gradient(180deg, #2a4e9a, #1a326e);
      border: 4px solid #f4f7ff;
      border-top: none;
      box-shadow: 0 10px 0 #1a326e, inset 0 0 0 3px #16306a;
    }
    .callout .kicker { margin: 0; color: #d7ecff; font-size: clamp(7px, 1.15vw, 12px); line-height: 1.5; }
    .callout .main { margin: 0; color: #fff8dc; font-size: clamp(11px, 2vw, 22px); line-height: 1.45; }
    .stage[data-view="baby"] .callout-baby,
    .stage[data-view="finale"] .callout-finale { display: flex; }
    .callout-finale .main {
      color: var(--gold);
      font-size: clamp(13px, 2.6vw, 30px);
      text-shadow: 3px 3px 0 #7a3412, 6px 6px 0 #120804;
    }
    .confetti { display: none; position: absolute; inset: 0; z-index: 4; overflow: hidden; pointer-events: none; }
    .stage[data-view="finale"] .confetti { display: block; }
    .confetti i { position: absolute; top: -8%; animation: fall linear infinite; }
    @keyframes fall { to { top: 110%; transform: rotate(180deg); } }

    .scanlines, .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 9; }
    .scanlines {
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 4px);
      mix-blend-mode: multiply;
      opacity: .35;
    }
    .vignette { background: radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.42) 100%); }

    .goal {
      display: none;
      margin: 2px 0 10px;
      padding-bottom: 8px;
      border-bottom: 3px dashed rgba(255, 217, 138, .35);
      color: #ffd98a;
      font-family: "Press Start 2P", monospace;
      font-size: clamp(8px, 1.15vw, 11px);
      line-height: 1.6;
      min-height: 0;
    }
    .goal.on { display: block; }
    .dialog {
      position: relative;
      padding: 18px 16px 14px;
      background: var(--panel);
      border: 4px solid var(--cream);
      box-shadow: 0 0 0 4px #101622, 7px 7px 0 #07080d;
    }
    .dialog-name {
      position: absolute;
      top: -12px;
      left: 14px;
      padding: 0 8px;
      background: var(--panel);
      color: var(--gold);
      font-size: 10px;
    }
    .dialog p:not(.goal) {
      margin: 0;
      font-family: "VT323", monospace;
      font-size: clamp(20px, 2.6vw, 30px);
      line-height: 1.15;
      min-height: 2.3em;
    }
    .caret {
      display: inline-block;
      width: .5em;
      height: .85em;
      margin-left: 4px;
      background: var(--cream);
      vertical-align: text-bottom;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      padding: 5px 4px 4px;
      border: 2px solid #5c5348;
      color: #8a8176;
      background: #211c18;
    }
    .slot.on { border-color: var(--gold); color: var(--gold); background: #3a2a12; }
    .slot.now { box-shadow: 0 0 0 2px #fff6ea; }
    .bag { color: #9be7ff; font-size: 8px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    @media (max-width: 640px) {
      .bezel { padding: 7px; border-radius: 14px; box-shadow: inset 0 0 0 3px #3c455c, 0 12px 0 #07060a; }
      .pixel-btn { font-size: 9px; padding: 13px 10px; }
      .dialog { padding: 16px 10px 12px; }
      .title-ui { width: min(86%, 260px); bottom: 4%; }
      .callout { min-height: 34%; }
      .callout-finale .main { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }
    }
  </style>
</head>

              <rect x="16" y="16" width="4" height="2" fill="#8d939c"/><rect x="17" y="18" width="3" height="3" fill="#7e868e"/><rect x="17" y="20" width="3" height="2" fill="#f4f1eb"/>
              <rect x="7" y="22" width="3" height="3" fill="#7e868e"/><rect x="12" y="22" width="3" height="3" fill="#7e868e"/>

            </svg>
          </div>

          <div class="hots hots-1">
            <button type="button" class="hot" data-id="art" aria-label="Cuadros" style="left:46%;top:11%;width:40%;height:18%"></button>
            <button type="button" class="hot" data-id="tv" aria-label="Televisor" style="left:16%;top:30%;width:24%;height:24%"></button>
            <button type="button" class="hot" data-id="console" aria-label="Consola" style="left:33%;top:53%;width:16%;height:13%"></button>
            <button type="button" class="hot" data-id="xbox" aria-label="Control de Xbox" style="left:86%;top:27%;width:10%;height:12%"></button>
            <button type="button" class="hot hot-chest" data-id="chest" aria-label="Cofre" style="left:62%;top:43%;width:18%;height:22%"></button>
          </div>
          <div class="hots hots-2">
            <button type="button" class="hot hot-tv2" data-id="tv2" aria-label="Televisor" style="left:16%;top:30%;width:24%;height:24%"></button>
            <button type="button" class="hot" data-id="lamp" aria-label="Lámpara" style="left:39%;top:18%;width:10%;height:18%"></button>
            <button type="button" class="hot" data-id="stereo" aria-label="Equipo de música" style="left:13.5%;top:50%;width:8.5%;height:15%"></button>

            <button type="button" class="hot hot-pillow" data-id="pillow" aria-label="Cojines del sillón" style="left:55%;top:42%;width:8%;height:9%"></button>
            <button type="button" class="hot hot-chest2" data-id="chest2" aria-label="Cofre" style="left:64%;top:40%;width:16%;height:22%"></button>
          </div>

          <div class="item key-pop" aria-hidden="true">
            <svg viewBox="0 0 22 12">
              <rect x="0" y="1" width="10" height="9" fill="#3a2410"/>
              <rect x="7" y="4" width="14" height="4" fill="#3a2410"/>
              <rect x="15" y="7" width="3" height="4" fill="#3a2410"/>
              <rect x="18" y="7" width="3" height="5" fill="#3a2410"/>
              <rect x="1" y="2" width="8" height="7" fill="#e8b43a"/>
              <rect x="1" y="2" width="8" height="2" fill="#fff0b0"/>
              <rect x="3" y="4" width="3" height="3" fill="#3a2410"/>
              <rect x="7" y="5" width="13" height="2" fill="#f0c14a"/>
              <rect x="7" y="5" width="12" height="1" fill="#fff0b0"/>
              <rect x="15" y="8" width="2" height="2" fill="#c48a22"/>
              <rect x="18" y="8" width="2" height="3" fill="#f0c14a"/>
            </svg>
          </div>
          <button type="button" class="item mystic" id="mystic" data-id="mystic" aria-label="Llave mística">
            <svg viewBox="0 0 22 12">
              <rect x="0" y="1" width="10" height="9" fill="#2a1848"/>
              <rect x="7" y="4" width="14" height="4" fill="#3a2410"/>
              <rect x="15" y="7" width="3" height="4" fill="#3a2410"/>
              <rect x="18" y="7" width="3" height="5" fill="#3a2410"/>
              <rect x="1" y="2" width="8" height="7" fill="#cbb6ff"/>
              <rect x="1" y="2" width="8" height="2" fill="#f6efff"/>
              <rect x="3" y="4" width="3" height="3" fill="#241444"/>
              <rect x="7" y="5" width="13" height="2" fill="#ffe566"/>
              <rect x="7" y="5" width="12" height="1" fill="#fff6c8"/>
              <rect x="15" y="8" width="2" height="2" fill="#7ee0ff"/>
              <rect x="18" y="8" width="2" height="3" fill="#ffe566"/>
            </svg>
            <span class="key-label">LLAVE</span>
          </button>
          <div class="item cart-pop" aria-hidden="true">
            <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
              <rect x="3" y="2" width="10" height="12" fill="#3a6fd0"/><rect x="5" y="4" width="6" height="4" fill="#f4f4f4"/><rect x="5" y="10" width="6" height="2" fill="#ffd45a"/>
            </svg>
          </div>

          <div class="callout callout-baby">
            <p class="kicker">MIEMBRO #3 DESBLOQUEADO</p>
            <p class="main">Un Bebé se ha unido a la partida!!!</p>
          </div>
          <div class="callout callout-finale">
            <p class="kicker">SUPER SALVO BROS</p>
            <p class="main">Juego Completo Abril 2027</p>
          </div>
          <div class="confetti" id="confetti" aria-hidden="true"></div>
        </div>

        <div class="title-ui">
          <h1 class="sr-only">SUPER SALVO BROS</h1>
          <p class="subtitle">Aventura en progreso</p>
          <button type="button" class="pixel-btn" id="start-btn">INICIAR PARTIDA</button>
        </div>
        <button type="button" class="sound-btn" id="sound-btn">SONIDO ON</button>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
      </div>
    </div>

    <div class="dialog mt-4" aria-live="polite">
      <div class="dialog-name" id="dname">SISTEMA</div>
      <p class="goal" id="goal"></p>
      <p id="dtext">Pulsa Iniciar partida.<span class="caret" aria-hidden="true"></span></p>
    </div>
    <div class="mt-4 flex justify-center">
      <button type="button" class="pixel-btn" id="action-btn" hidden>Comenzar Aventura</button>
    </div>
    <p class="sr-only" id="live" aria-live="polite"></p>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const room = document.getElementById("room");
    const dname = document.getElementById("dname");
    const dtext = document.getElementById("dtext");
    const goal = document.getElementById("goal");
    const quest = document.getElementById("quest");
    const world = document.getElementById("world");
    const live = document.getElementById("live");
    const actionBtn = document.getElementById("action-btn");
    const soundBtn = document.getElementById("sound-btn");
    const slots = [...document.querySelectorAll(".slot")];

    const flags = { key: false, cart: false, tv: false, baby: false, muted: false, clue: 0, heard: "" };
    let phase = "title";
    let audio = { ctx: null, timer: 0, mode: null, master: null };
    let roomToken = 0;

    const colors = ["#ffd45a", "#ff7a5c", "#7ee0c8", "#fff6ea", "#7eb6ff", "#ff8ad4"];
    const confetti = document.getElementById("confetti");
    for (let i = 0; i < 26; i += 1) {
      const bit = document.createElement("i");
      const size = 6 + (i % 3) * 3;
      bit.style.left = `${(i * 37) % 100}%`;
      bit.style.width = `${size}px`;
      bit.style.height = `${size}px`;
      bit.style.background = colors[i % colors.length];
      bit.style.animationDuration = `${2.6 + (i % 5) * 0.35}s`;
      bit.style.animationDelay = `${(i % 8) * 0.2}s`;
      confetti.appendChild(bit);
    }
    if (location.search.includes("debug")) document.documentElement.classList.add("debug");

    function say(name, text) {
      dname.textContent = name;
      dtext.innerHTML = `${text}<span class="caret" aria-hidden="true"></span>`;
      live.textContent = text;
    }

    function setGoal(text) {
      goal.textContent = text;
      goal.classList.toggle("on", Boolean(text));
    }

    function setParty(ids, current) {
      slots.forEach((slot) => {
        const id = Number(slot.dataset.slot);
        slot.classList.toggle("on", ids.includes(id));
        slot.classList.toggle("now", id === current);
      });
    }

    function setRoom(src, alt) {
      if (room.dataset.src === src) return;
      room.dataset.src = src;
      room.alt = alt;
      const token = ++roomToken;
      room.classList.add("is-fading");
      window.setTimeout(() => {
        if (token !== roomToken) return;
        room.onload = () => {
          if (token === roomToken) room.classList.remove("is-fading");
        };
        room.src = src;
      }, 220);
    }

    function showAction(label) {
      actionBtn.hidden = !label;
      if (label) actionBtn.textContent = label;
    }

    function go(next) {
      phase = next;
      stage.dataset.view = next;
      if (next === "title") {
        stage.classList.remove("in-room", "has-key", "has-cart", "has-mystic", "tv-on", "quake", "chest-glow", "show-toys");
        flags.key = false;
        flags.cart = false;
        flags.tv = false;
        flags.baby = false;
        flags.clue = 0;
        flags.heard = "";
        room.dataset.src = "";
        stopMusic();
        world.textContent = "WORLD 1-1";
        quest.textContent = "INTRO";
        setGoal("");
        setParty([], 0);
        showAction("");
        say("SISTEMA", "Pulsa Iniciar partida.");
        return;
      }
      stage.classList.add("in-room");
    }

    function startGame() {
      ensureAudio();
      playMusic("calm");
      blip([392, 523, 659]);
      flags.clue = 0;
      flags.heard = "";
      go("hunt");
      setRoom("assets/scene-vicente.jpg", "Vicente en la sala, junto al cofre, la tele y el robot.");
      world.textContent = "WORLD 1-1";
      quest.textContent = "NIVEL 1";
      setGoal("Objetivo: encuentra la llave escondida.");
      setParty([1], 1);
      showAction("");
      say("VICENTE", "Vicente, para abrir el cofre debes encontrar la llave escondida. Pasa el cursor por la sala. Los cuadros guardan la primera pista.");
    }

    function findKey() {
      if (flags.key) {
        say("VICENTE", "Ya tienes la llave. Ahora abre el cofre.");
        return;
      }
      flags.key = true;
      flags.clue = 4;
      flags.heard = "";
      stage.classList.add("has-key");
      setGoal("Objetivo: abre el cofre.");
      blip([523, 659, 784]);
      say("VICENTE", "¡La llave estaba en el control de la Xbox! Ya puedes abrir el cofre.");
    }

    function openChest() {
      if (!flags.key) {
        say("COFRE", "Está cerrado. " + nudge(chains.hunt));
        return;
      }
      blip([440, 554, 659, 880]);
      go("bruno");
      stage.classList.add("chest-glow");
      setRoom("assets/scene-duda.jpg", "Bruno se une con gorro de Minecraft y dinosaurios de juguete.");
      world.textContent = "WORLD 1-1";
      quest.textContent = "P2 BRUNO";
      setGoal("Bruno se ha unido al juego.");
      setParty([1, 2], 2);
      showAction("Comenzar Aventura");
      say("SISTEMA", "Bruno se ha unido al juego! Trae gorros de minecraft y dinosaurios.");
    }

    function nextLevel() {
      stage.classList.remove("chest-glow", "has-key", "show-toys");
      flags.clue = 0;
      flags.heard = "";
      go("level2");
      setRoom("assets/scene-duda.jpg", "Vicente y Bruno en la sala, antes de comenzar la aventura.");
      world.textContent = "WORLD 1-2";
      quest.textContent = "NIVEL 2";
      setGoal("Objetivo: conecta el juego al televisor.");
      setParty([1, 2], 2);
      showAction("");
      say("SISTEMA", "Antes de comenzar la aventura tienen que conectar el juego al televisor. Busca el cartucho del juego. La lámpara guarda la primera pista.");
    }

    function findCart() {
      if (flags.tv) return;
      if (flags.cart) {
        say("BRUNO", "El juego ya está con ustedes. Enciendan el televisor.");
        return;
      }
      flags.cart = true;
      flags.clue = 4;
      flags.heard = "";
      stage.classList.add("has-cart");
      setGoal("Objetivo: enciende el televisor.");
      blip([494, 659]);
      say("BRUNO", "¡El juego estaba entre los cojines! Ahora enciende la tele.");
      window.setTimeout(() => stage.classList.remove("has-cart"), 1400);
    }

    function powerTv() {
      if (!flags.cart) {
        say("TV", "Sin el cartucho no enciende. " + nudge(chains.level2));
        return;
      }
      if (flags.tv) return;
      flags.tv = true;
      stage.classList.add("tv-on", "quake");
      rumble();
      playMusic("mystic");
      setGoal("La sala está temblando...");
      say("???", "La tele se enciende y todo empieza a temblar. Vicente y Bruno no entienden nada.");
      window.setTimeout(() => {
        setRoom("assets/scene-juntos.jpg", "Vicente y Bruno, confundidos, con signos de interrogación.");
        stage.classList.add("has-mystic");
        stage.dataset.view = "quake";
        phase = "quake";
        setGoal("Objetivo: usa la llave mística en el cofre.");
        say("???", "Apareció una llave sorpresa!!!!  Abre el cofre para encontrar la sorpresa.");
      }, 900);
    }

    function openMystic() {
      if (!flags.tv || flags.baby) return;
      flags.baby = true;
      blip([392, 523, 659, 784, 1046]);
      stage.classList.add("chest-glow");
      stage.classList.remove("show-toys", "quake");
      go("baby");
      setRoom("assets/scene-bebe.jpg", "El cofre se ilumina y sale el bebé.");
      world.textContent = "WORLD 1-2";
      quest.textContent = "BEBÉ";
      setGoal("Un Bebé se ha unido a la partida!!!");
      setParty([1, 2, 3], 3);
      showAction("CONTINUAR");
      say("SISTEMA", "Un bebé se ha unido a la partida. Otro hermano(a) Salvo acompañara a Vicente y Bruno en la aventura!!!!");
    }

    function finale() {
      go("finale");
      stage.classList.add("chest-glow");
      setRoom("assets/scene-fiesta.jpg", "Los tres hermanos celebran.");
      world.textContent = "WORLD 1-2";
      quest.textContent = "VICTORIA";
      setGoal("");
      setParty([1, 2, 3], 3);
      showAction("JUGAR DE NUEVO");
      playMusic("party");
      say("SALVO BROS", "Ohhhh NO!!! El bebé babeo sobre el código del juego. Mamá seguirá trabajando para entregarles la versión completa...");
    }

    function restart() {
      go("title");
    }

    const hints = {
      art: "Los cuadros miran hacia la tele. La primera pista está en esa pantalla.",
      tv: "La tele está apagada. En la mesita hay una consola que parece incompleta.",
      console: "A esta consola le falta su pareja. El control de la Xbox, en la biblioteca, guarda el secreto.",
      xbox: "Este control suena a metal por dentro. Haz clic si crees que la llave está aquí.",
      chest: "El cofre está cerrado. La llave sigue escondida en la sala."
    };

    const hints2 = {
      lamp: "La lámpara alumbra el equipo de música, al costado de la tele.",
      stereo: "El equipo de música no suena. Los dinosaurios del piso tienen la siguiente pista.",
      dinos: "Los dinosaurios miran hacia el sillón. El cartucho está entre los cojines.",
      pillow: "Estos cojines esconden algo duro. Haz clic si crees que el cartucho está aquí.",
      tv2: "La tele sigue apagada. La primera pista está en la lámpara.",
      chest2: "El cofre puede esperar. Primero encuentren el cartucho."
    };

    const chains = {
      hunt: ["art", "tv", "console", "xbox"],
      level2: ["lamp", "stereo", "dinos", "pillow"]
    };
    const nudgeText = {
      art: "Mira los cuadros.",
      tv: "Ahora mira la tele.",
      console: "Ahora mira la consola.",
      xbox: "Ahora prueba el control de la Xbox.",
      lamp: "Mira la lámpara.",
      stereo: "Ahora mira el equipo de música.",
      dinos: "Ahora mira los dinosaurios.",
      pillow: "Ahora revisa los cojines del sillón."
    };

    function nudge(order) {
      const id = order[Math.min(flags.clue, order.length - 1)];
      return nudgeText[id] || "Sigue la pista de ahora.";
    }

    function gateHint(id, order, book) {
      const index = order.indexOf(id);
      if (index < 0) return false;
      if (index > flags.clue) {
        say("PISTA", "Todavía no. " + nudge(order));
        return true;
      }
      if (id === flags.heard) {
        say("PISTA", book[id]);
        return true;
      }
      if (index < flags.clue) {
        say("PISTA", flags.clue >= order.length
          ? "Esa pista ya la seguiste."
          : "Esa pista ya la seguiste. " + nudge(order));
        return true;
      }
      say("PISTA", book[id]);
      if (id !== "xbox" && id !== "pillow") {
        flags.heard = id;
        flags.clue += 1;
      }
      return true;
    }

    function showHint(id) {
      if (phase === "hunt" && (hints[id] || id === "chest")) {
        if (id === "chest") {
          say(flags.key ? "COFRE" : "PISTA", flags.key
            ? "La llave encaja. Haz clic en el cofre para abrirlo."
            : "El cofre está cerrado. " + nudge(chains.hunt));
          return;
        }
        gateHint(id, chains.hunt, hints);
        return;
      }
      if (phase === "level2" && (hints2[id] || id === "tv2" || id === "chest2")) {
        if (id === "pillow" && flags.cart) {
          say("BRUNO", "El cartucho ya está con ustedes. Enciendan el televisor.");
          return;
        }
        if (id === "tv2") {
          say("TV", flags.cart
            ? "Ya tienen el cartucho. Haz clic en la tele para encenderla."
            : "La tele sigue apagada. " + nudge(chains.level2));
          return;
        }
        if (id === "chest2") {
          say("COFRE", flags.cart
            ? "Primero enciendan el televisor."
            : "El cofre puede esperar. " + nudge(chains.level2));
          return;
        }
        gateHint(id, chains.level2, hints2);
      }
    }

    function activate(id) {
      if (phase === "hunt" && hints[id] && id !== "xbox" && id !== "chest") {
        blip([440]);
        showHint(id);
        return;
      }
      if (phase === "level2" && hints2[id] && id !== "pillow" && id !== "tv2" && id !== "chest2") {
        blip([440]);
        showHint(id);
        return;
      }
      if (id === "xbox" && phase === "hunt") {
        if (flags.clue < chains.hunt.indexOf("xbox")) return showHint("xbox");
        return findKey();
      }
      if (id === "chest" && phase === "hunt") return openChest();
      if (id === "pillow" && (phase === "level2" || phase === "quake")) {
        if (phase === "level2" && flags.clue < chains.level2.indexOf("pillow")) return showHint("pillow");
        return findCart();
      }
      if (id === "tv2" && (phase === "level2" || phase === "quake")) return powerTv();
      if ((id === "mystic" || id === "chest2") && phase === "quake") return openMystic();
      if (id === "chest2" && phase === "level2") say("COFRE", "Ahora no. Primero conecten el juego al televisor.");
    }

    document.querySelectorAll(".hot, #mystic").forEach((hot) => {
      hot.addEventListener("pointerenter", () => {
        if (window.matchMedia("(hover: hover)").matches) showHint(hot.dataset.id);
      });
      hot.addEventListener("click", () => activate(hot.dataset.id));
    });

    document.getElementById("start-btn").addEventListener("click", startGame);
    actionBtn.addEventListener("click", () => {
      if (phase === "bruno") nextLevel();
      else if (phase === "baby") finale();
      else if (phase === "finale") restart();
    });

    function ensureAudio() {
      if (!audio.ctx) {
        audio.ctx = new AudioContext();
        audio.master = audio.ctx.createGain();
        audio.master.gain.value = 0.9;
        audio.master.connect(audio.ctx.destination);
      }
      if (audio.ctx.state === "suspended") audio.ctx.resume();
    }

    function blip(notes) {
      try {
        ensureAudio();
        if (flags.muted) return;
        notes.forEach((note, index) => {
          const osc = audio.ctx.createOscillator();
          const gain = audio.ctx.createGain();
          osc.type = "square";
          osc.frequency.value = note;
          const start = audio.ctx.currentTime + index * 0.07;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.05, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.09);
          osc.connect(gain);
          gain.connect(audio.master);
          osc.start(start);
          osc.stop(start + 0.1);
        });
      } catch (error) { /* sin audio */ }
    }

    function rumble() {
      try {
        ensureAudio();
        if (flags.muted) return;
        const ctx = audio.ctx;
        const length = Math.floor(ctx.sampleRate * 1.1);
        const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 160;
        const gain = ctx.createGain();
        gain.gain.value = 0.35;
        src.buffer = buffer;
        src.connect(filter);
        filter.connect(gain);
        gain.connect(audio.master);
        src.start();
      } catch (error) { /* sin audio */ }
    }

    function stopMusic() {
      window.clearTimeout(audio.timer);
      audio.mode = null;
    }

    function playMusic(mode) {
      try {
        ensureAudio();
        if (audio.mode === mode) return;
        stopMusic();
        audio.mode = mode;
        const tunes = {
          mystic: { notes: [196, 233, 196, 174, 156, 174, 196, 247], step: 0.28, gain: 0.04 },
          calm: { notes: [262, 330, 392, 330, 294, 330, 349, 294], step: 0.42, gain: 0.028 },
          party: {
            notes: [523, 659, 784, 1047, 784, 659, 880, 784, 698, 880, 1047, 880, 784, 659, 587, 523],
            harmony: [392, 523, 659, 784, 659, 523, 698, 659, 523, 698, 784, 698, 659, 523, 494, 392],
            bass: [131, 0, 196, 0, 131, 0, 175, 0, 147, 0, 220, 0, 196, 0, 165, 131],
            step: 0.15,
            gain: 0.034
          }
        };
        const tune = tunes[mode] || tunes.calm;
        const pattern = tune.notes;
        const step = tune.step;
        const loop = () => {
          if (audio.mode !== mode || flags.muted) {
            if (audio.mode === mode) audio.timer = window.setTimeout(loop, pattern.length * step * 1000);
            return;
          }
          const ctx = audio.ctx;
          const t0 = ctx.currentTime + 0.05;
          const voice = (freq, index, type, level) => {
            if (!freq) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            const t = t0 + index * step;
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(level, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + step * 0.85);
            osc.connect(gain);
            gain.connect(audio.master);
            osc.start(t);
            osc.stop(t + step);
          };
          pattern.forEach((freq, index) => voice(freq, index, "square", tune.gain));
          if (tune.harmony) tune.harmony.forEach((freq, index) => voice(freq, index, "triangle", 0.02));
          if (tune.bass) tune.bass.forEach((freq, index) => voice(freq, index, "square", 0.03));
          if (mode === "mystic") {
            const drone = ctx.createOscillator();
            const gain = ctx.createGain();
            drone.type = "sawtooth";
            drone.frequency.value = 55;
            gain.gain.value = 0.018;
            drone.connect(gain);
            gain.connect(audio.master);
            drone.start(t0);
            drone.stop(t0 + pattern.length * step);
          }
          audio.timer = window.setTimeout(loop, pattern.length * step * 1000 - 30);
        };
        loop();
      } catch (error) { /* sin audio */ }
    }

    soundBtn.addEventListener("click", () => {
      flags.muted = !flags.muted;
      soundBtn.textContent = flags.muted ? "SONIDO OFF" : "SONIDO ON";
      if (!flags.muted && phase !== "title") {
        const mode = audio.mode;
        audio.mode = null;
        playMusic(mode || "calm");
      }
    });

    go("title");
  </script>
